services:
  mysql-scheduling:
    image: mysql:8
    container_name: mysql-scheduling
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: scheduling_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-scheduling-data:/var/lib/mysql

volumes:
  mysql-scheduling-data:
